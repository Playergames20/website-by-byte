<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Info o użytkowniku 😎</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: #0f0;
            padding: 20px;
        }
        .box {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>📡 Info o Twoim urządzeniu</h1>

<div class="box">
    <p><b>System:</b> <span id="os"></span></p>
    <p><b>Przeglądarka:</b> <span id="browser"></span></p>
    <p><b>Język:</b> <span id="lang"></span></p>
    <p><b>Rozdzielczość:</b> <span id="res"></span></p>
    <p><b>Godzina lokalna:</b> <span id="time"></span></p>

    <p><b>IP:</b> <span id="ip">Ładowanie...</span></p>
    <p><b>Miasto:</b> <span id="city"></span></p>
    <p><b>Region:</b> <span id="region"></span></p>
    <p><b>Kraj:</b> <span id="country"></span></p>

    <p><b>Typ wejścia:</b> <span id="entry"></span></p>
</div>

<script>
    // 🧠 SYSTEM
    let os = "Nieznany";
    if (navigator.userAgent.includes("Windows")) os = "Windows";
    if (navigator.userAgent.includes("Mac")) os = "MacOS";
    if (navigator.userAgent.includes("Android")) os = "Android";
    if (navigator.userAgent.includes("Linux")) os = "Linux";
    document.getElementById("os").innerText = os;

    // 🌐 przeglądarka
    document.getElementById("browser").innerText = navigator.userAgent;

    // 🧠 język
    document.getElementById("lang").innerText = navigator.language;

    // 📺 rozdzielczość
    document.getElementById("res").innerText = screen.width + "x" + screen.height;

    // ⏰ czas
    document.getElementById("time").innerText = new Date().toLocaleString();

    // 🌍 IP + GEOLOCATION
    fetch("https://ipapi.co/json/")
        .then(res => res.json())
        .then(data => {
            document.getElementById("ip").innerText = data.ip || "Nieznane";
            document.getElementById("city").innerText = data.city || "Nieznane";
            document.getElementById("region").innerText = data.region || "Nieznane";
            document.getElementById("country").innerText = data.country_name || "Nieznane";
        })
        .catch(() => {
            document.getElementById("ip").innerText = "Błąd";
            document.getElementById("city").innerText = "Błąd";
            document.getElementById("region").innerText = "Błąd";
            document.getElementById("country").innerText = "Błąd";
        });

    // 🚪 TYP WEJŚCIA
    let ref = document.referrer;
    let entryType = "Direct (bezpośrednie wejście)";

    if (!ref) {
        entryType = "Direct (bezpośrednie wejście)";
    } 
    else if (ref.includes("google")) {
        entryType = "Wejście z Google 🔍";
    }
    else if (ref.includes("youtube")) {
        entryType = "Wejście z YouTube ▶️";
    }
    else {
        entryType = "Wejście z innej strony 🌐";
    }

    document.getElementById("entry").innerText = entryType;
</script>

</body>
</html>
