<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informacje o stronie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4f8;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .page-card {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            padding: 2rem 2rem 2rem 2rem;
            transition: 0.2s;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1e2f3e;
            margin-bottom: 1.2rem;
            border-left: 5px solid #2c7da0;
            padding-left: 1rem;
        }

        .info-content {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #2c3e44;
        }

        /* bardzo minimalistyczne */
        hr {
            margin: 1.5rem 0 1rem;
            border: 0;
            height: 1px;
            background: #e2e8f0;
        }

        .footer-note {
            font-size: 0.75rem;
            color: #6c8e9e;
            margin-top: 1.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="page-card">
    <!-- Główny nagłówek z treścią "Informacje o stronie internetowej" -->
    <h3>📄 Informacje o stronie internetowej</h3>
    <h1>📄 Tutaj znajdziesz informacje o stronie internetowej które mogą ci się przydać</h1>
    
    <!-- Tutaj wstawisz własne informacje – edytuj poniższy akapit lub dodaj własne elementy -->
    <div class="info-content">
        <!-- To jest przykładowy tekst startowy, który możesz zastąpić swoją treścią -->
        <p></p>
    </div>

    <!-- Minimalna stopka (opcjonalna, możesz usunąć) -->
    <hr>
    <div class="footer-note">
        edytuj swobodnie — to tylko szkic
    </div>
</div>
</body>
</html>
